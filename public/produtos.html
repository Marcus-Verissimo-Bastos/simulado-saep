<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="caixa grande">
    <h2>Produtos</h2>
    <a href="principal.html"><button>Voltar</button></a>

    <h3>Cadastro</h3>
    <input id="nome" placeholder="Nome">
    <input id="estoque" type="number" placeholder="Estoque">
    <input id="quantidade" type="number" placeholder="Quantidade">
    <button onclick="salvar()">Salvar</button>

    <h3>Buscar</h3>
    <input id="busca" placeholder="Buscar por nome" oninput="listar()">

    <table>
      <thead><tr><th>ID</th><th>Nome</th><th>Estoque</th><th>Quantidade</th><th></th></tr></thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>

  <script>
    if (!localStorage.getItem('usuario')) location.href = 'index.html';

    let editandoId = null;

    async function listar() {
      const busca = document.getElementById('busca').value;
      const resp = await fetch('/produtos?busca=' + encodeURIComponent(busca));
      const produtos = await resp.json();

      const tabela = document.getElementById('tabela');
      tabela.innerHTML = '';
      for (const p of produtos) {
        tabela.innerHTML += `
          <tr>
            <td>${p.id}</td><td>${p.nome}</td><td>${p.estoque}</td><td>${p.quantidade}</td>
            <td>
              <button onclick="editar(${p.id}, '${p.nome}', ${p.estoque}, ${p.quantidade})">Editar</button>
              <button class="vermelho" onclick="excluir(${p.id})">Excluir</button>
            </td>
          </tr>`;
      }
    }

    async function salvar() {
      const corpo = {
        nome: document.getElementById('nome').value,
        estoque: Number(document.getElementById('estoque').value),
        quantidade: Number(document.getElementById('quantidade').value)
      };
      if (!corpo.nome) { alert('Informe o nome.'); return; }

      const url = editandoId ? '/produtos/' + editandoId : '/produtos';
      const metodo = editandoId ? 'PUT' : 'POST';
      await fetch(url, {
        method: metodo,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
      });

      editandoId = null;
      document.getElementById('nome').value = '';
      document.getElementById('estoque').value = '';
      document.getElementById('quantidade').value = '';
      listar();
    }

    function editar(id, nome, estoque, quantidade) {
      editandoId = id;
      document.getElementById('nome').value = nome;
      document.getElementById('estoque').value = estoque;
      document.getElementById('quantidade').value = quantidade;
    }

    async function excluir(id) {
      if (!confirm('Excluir este produto?')) return;
      const resp = await fetch('/produtos/' + id, { method: 'DELETE' });
      if (!resp.ok) { const d = await resp.json(); alert(d.erro); }
      listar();
    }

    listar();
  </script>
</body>
</html>
